[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[project]
name = "solara-assets2"
authors = [{name = "Maarten A. Breddels", email = "maartenbreddels@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.8"

classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    # older versions of solara do not look in the directory where we install
    "solara>1.64.1",
]

[project.urls]
Home = "https://www.github.com/widgetti/solara"

[tool.hatch.version]
path = "solara_assets2/__init__.py"

# Used to call hatch_build.py
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["solara_assets2"]

# The cdn directory is downloaded when the wheel is built, the sdist does not
# need a copy. This halves the storage we use on PyPI.
[tool.hatch.build.targets.sdist]
exclude = ["/cdn"]

[tool.hatch.build.targets.wheel.shared-data]
"cdn" = "share/solara-assets2/cdn"
# Solara turns off the assets proxy when it cannot create its cache directory, for instance
# when root installs solara and another user runs it. So pip has to create that directory,
# or the server would not serve the files we install.
"cache_dir_placeholder" = "share/solara/cdn/.solara-assets2"

[tool.black]
line-length = 160

[tool.isort]
profile = "black"
