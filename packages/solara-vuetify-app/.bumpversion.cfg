[bumpversion]
current_version = 10.1.1
commit = True
tag = True
tag_name = @widgetti/solara-vuetify-app@{new_version}
tag_message = Bump version solara-vuetify-app: {current_version} → {new_version}
message = Bump version solara-vuetify-app: {current_version} → {new_version}

[bumpversion:file:package.json]

[bumpversion:file:../../solara/server/frontend_assets.py]
search = SOLARA_VUETIFY_APP_VERSION = "{current_version}"
replace = SOLARA_VUETIFY_APP_VERSION = "{new_version}"

[bumpversion:file:../../release.sh]

[bumpversion:file:../solara-assets/hatch_build.py]
search = ["@widgetti/solara-vuetify-app", "{current_version}"]
replace = ["@widgetti/solara-vuetify-app", "{new_version}"]
