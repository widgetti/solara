{% raw -%}
<transition name="solara-transition">
    <div v-if="loading" id="loader-container">
        <div class="solara-card" style="width: 600px">
            <div class="solara-progress-linear solara-progress-linear--static"
                :class="loadingPercentage < 0 ? 'solara-progress-linear--indeterminate' : ''"
                :style="loadingPercentage < 0 ? {} : {'--solara-progress': loadingPercentage + '%'}"></div>
            <div class="solara-card__title">
                <h1>{{ loading_text }}</h1>
            </div>
        </div>
    </div>
    <div v-else>
        <jupyter-widget-mount-point v-if="!loading && !remounting" :key="remountKey" mount-id="solara-main">
            A widget with mount-id="solara-main" should go here
        </jupyter-widget-mount-point>
    </div>
</transition>
{% endraw -%}
