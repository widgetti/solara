<style>html {

  /* disable min-height: 100vh set by vuetify */
  min-height: unset;
}

.vuetify-styles {
  /* Rules set on the html element in the vuetify styles are no longer applied after prefixing all selectors, so copy
     * them here. */
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);

  box-sizing: border-box;

                    if (Vue.h && ['VueTemplateModel', 'VuetifyTemplateModel', 'HtmlModel'].includes(model.get('_model_name'))) {

    //
